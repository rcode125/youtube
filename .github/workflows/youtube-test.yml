name: YouTube video analysis

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze YouTube video
        run: |
          echo "Warte 15 Sekunden..."
          sleep 15

          VIDEO_ID="VIDEO_ID"

          echo "=== oEmbed ==="
          curl -sS \
            "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${VIDEO_ID}&format=json" \
            | python3 -m json.tool

          echo
          echo "=== Video page ==="
          curl -sS -L \
            "https://www.youtube.com/watch?v=${VIDEO_ID}" \
            -o youtube.html

          echo "YouTube response:"
          wc -c youtube.html

          echo
          echo "Suche nach videoDetails..."
          grep -o '"videoDetails"[^}]*' youtube.html | head -c 2000 || true
